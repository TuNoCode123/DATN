# =============================================================================
# DEPLOY WEB — Build Next.js image → Push to Artifact Registry → Deploy to Cloud Run
# =============================================================================
# Same flow as deploy-api.yml but for the Next.js frontend.
# No migrations step (frontend doesn't touch the database).
# =============================================================================

name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-web.yml'

env:
  GCP_REGION: asia-southeast1
  GCP_PROJECT_ID: ielts-ai-491816
  ARTIFACT_REPO: ielts-ai-web
  CLOUD_RUN_SERVICE: ielts-ai-web
  URL_MAP: ielts-ai-url-map  # from infra-gcp/modules/load-balancer

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build → Push Artifact Registry → Deploy Cloud Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build with NEXT_PUBLIC_* baked in at build time (Next.js inlines
      # these into the client bundle during build, not at runtime — see
      # apps/web/Dockerfile's ARG/ENV pairs).
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_PAYPAL_CLIENT_ID=${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # See deploy-api.yml's note — Buildx's default provenance manifest
          # triggers a 400 on Artifact Registry's push-time HEAD check.
          provenance: false

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}:${{ github.sha }}

      # After deploying new code, invalidate Cloud CDN's cache so users get
      # fresh assets. /_next/static/* is cached for a while (see the
      # load-balancer module's cdn_policy) — without invalidation, stale
      # files persist.
      - name: Invalidate Cloud CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache ${{ env.URL_MAP }} \
            --path "/_next/static/*" \
            --async
