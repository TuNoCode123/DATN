# =============================================================================
# DEPLOY API — Build Docker image → Push to Artifact Registry → Deploy to Cloud Run
# =============================================================================
# Triggered on push to main when API code changes.
# Uses Workload Identity Federation for GCP auth (no stored credentials).
# Runs migrations before deploying new code (safe: prisma migrate deploy only
# applies pending migration files, and works fine against the old code too).
# =============================================================================

name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/deploy-api.yml'

env:
  GCP_REGION: asia-southeast1
  GCP_PROJECT_ID: ielts-ai-491816
  ARTIFACT_REPO: ielts-ai-api      # from infra-gcp/modules/artifact-registry
  CLOUD_RUN_SERVICE: ielts-ai-api  # from infra-gcp/modules/cloud-run
  CLOUD_RUN_JOB: ielts-ai-migrate  # from infra-gcp/modules/cloud-run

# WIF permissions: allows GitHub to request temporary GCP credentials
permissions:
  id-token: write    # Needed for OIDC token exchange with Google
  contents: read      # Needed to checkout repository code

jobs:
  build-and-deploy:
    name: Build → Push Artifact Registry → Migrate → Deploy Cloud Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Step 1: Authenticate to GCP using Workload Identity Federation (no
      # stored service account keys!)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Step 2: Docker login to Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build and push Docker image with commit SHA tag
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Buildx's default provenance/SBOM attestation manifest triggers a
          # "400 Bad Request" on the HEAD check Artifact Registry does during
          # push — a known incompatibility, not specific to this image.
          provenance: false

      # Step 4: Run Prisma database migrations BEFORE deploying new code.
      # `gcloud run jobs execute --wait` blocks until the job finishes and
      # exits non-zero if the job failed, same guarantee the AWS side's
      # `aws ecs wait tasks-stopped` + exit-code check provided.
      - name: Run database migrations
        run: |
          gcloud run jobs update ${{ env.CLOUD_RUN_JOB }} \
            --region=${{ env.GCP_REGION }} \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}:${{ github.sha }}

          gcloud run jobs execute ${{ env.CLOUD_RUN_JOB }} \
            --region=${{ env.GCP_REGION }} \
            --wait

      # Step 5: Deploy new image to Cloud Run (revision-based, automatic
      # rolling traffic shift once the new revision passes its health check)
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}:${{ github.sha }}
