name: Infrastructure

on:
  workflow_dispatch:  # Manual trigger only — Terraform runs locally, not in CI

env:
  GCP_REGION: asia-southeast1        # must match infra-gcp/variables.tf's default
  TF_VERSION: "1.10"
  TF_VAR_project_id: ielts-ai-491816 # not a secret — GCP project IDs are just identifiers

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform Plan / Apply (prod)
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra-gcp
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        env:
          # Optional — leave the corresponding GitHub secret unset and these
          # variables keep their "" defaults (Google Sign-In stays disabled,
          # PayPal client secret stays a placeholder). See
          # infra-gcp/modules/identity-platform's header comment.
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_paypal_client_id: ${{ secrets.PAYPAL_CLIENT_ID }}
          TF_VAR_paypal_client_secret: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          TF_VAR_paypal_webhook_id: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          TF_VAR_next_public_paypal_client_id: ${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
        run: terraform plan -no-color -out=tfplan

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const plan = `${{ steps.plan.outputs.stdout }}`;
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '...' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
